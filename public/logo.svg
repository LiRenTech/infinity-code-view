      <stop offset="1" stop-color="#091829"/>
    </linearGradient>
    <linearGradient id="rim" x1="256" y1="64" x2="768" y2="960" gradientUnits="userSpaceOnUse">
      <stop stop-color="#9DDCF3" stop-opacity=".3"/>
